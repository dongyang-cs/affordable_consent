# version: "3"
services:
  ganache_db:
    image: trufflesuite/ganache:v7.7.3
    restart: unless-stopped
    command: --accounts 5000 -e 1e18 -l 1000000000
    ports:
      - 8545:8545
    environment:
      - VIRTUAL_PORT=8545
    volumes:
      - ${STORAGE_PATH:-./running_data}/ganache_db:/ganache_db

  kv_http:
    image: hashicorp/consul:1.19
    restart: unless-stopped
    command: agent -dev -client=0.0.0.0 -ui
    ports:
      - 8500:8500


